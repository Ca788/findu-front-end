name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (fluxos críticos + visual)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: findu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      E2E_API_BASE_URL: http://localhost:3000/api/v1
      E2E_FRONT_URL: http://localhost:5147

    steps:
      - name: Checkout front-end
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Ca788/findu
          ref: ${{ vars.E2E_BACKEND_REF || 'main' }}
          token: ${{ secrets.E2E_BACKEND_TOKEN }}
          path: backend

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
          working-directory: backend

      - name: Boot backend
        working-directory: backend
        env:
          RAILS_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/findu_e2e
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: e2e-secret-key-base
          DEVISE_JWT_SECRET_KEY: e2e-devise-jwt-secret
          FRONTEND_ORIGIN: http://localhost:5147
          RACK_ATTACK_ENABLED: "false"
        run: |
          bundle exec rails db:prepare
          nohup bundle exec rails server -p 3000 -b 0.0.0.0 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && break
            sleep 2
          done

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run E2E
        run: yarn e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            backend.log
          if-no-files-found: ignore
